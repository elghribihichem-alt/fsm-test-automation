[pytest]
# Répertoire par défaut des tests
testpaths = tests

# Options par défaut
addopts = 
    -v
    --tb=short
    --strict-markers
    --html=reports/report.html
    --self-contained-html

# Marqueurs personnalisés (évite les warnings)
markers =
    smoke: Suite de fumée — chemin critique rapide
    regression: Suite de régression complète
    modules: Tests dédiés aux modules métier de l'application FSM

# Fichiers de test reconnus
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Affichage
console_output_style = progress